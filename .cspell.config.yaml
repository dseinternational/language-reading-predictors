---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
language: en-GB
dictionaryDefinitions:
    - name: en
      path: './config/spellcheck/allow-en.txt'
      addWords: true
dictionaries:
    - en
ignorePaths:
    - 'node_modules'
    - 'config/**'
    - 'AGENTS.md'
    - 'CLAUDE.md'
    - '.github/copilot-instructions.md'
    # Generated artefacts (gitignored) — not source content to spell-check.
    - 'output/**'
    - 'outputs/**'
    - 'figures/**'
patterns:
  - name: markdown_citation
    pattern: |
      /
          \[(?:@[^\s;\]]+)(?:\s*;\s*@[^\s;\]]+)*\]
      /gmx
  - name: markdown_inline_math
    pattern: |
      /
          \$[^$\n]+\$
      /gmx
  - name: markdown_display_math
    pattern: |
      /
          ^\s*\$\$[^$\n]*
          [\s\S]*?
          ^\s*\$\$
      /gmx
  - name: markdown_code_block
    pattern: |
      /
          ^(\s*`{3,}).*
          [\s\S]*?
          ^\1
      /gmx
  # Quarto's option name uses US "math"; British prose should still say "maths".
  - name: quarto_html_math_method
    pattern: /html-math-method/g
ignoreRegExpList:
    - quarto_html_math_method
    - markdown_code_block
    - markdown_citation
    - markdown_inline_math
    - markdown_display_math