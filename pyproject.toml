[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "dse-language-reading-predictors"
dynamic = ["version"]
description = "Predictors of progress in language and reading skills for children with Down syndrome"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Frank Buckley" }]

dependencies = [
  # The shared package supplies the scientific stack and these optional layers.
  # The graphs extra also needs the system Graphviz dot binary.
  "dse-research-utils[boosting,columnar,dependence,graphs,io,notebook,tuning,viz]"
]

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "pandas-stubs",
  "pytest>=9.1.1",
  "ruff>=0.16.10",
  "scipy-stubs"
]

[tool.uv]
# Resolve the supported Linux, Apple Silicon macOS and native Windows platforms.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[tool.uv.sources]
# Resolve the shared library from a release tag. For local development:
#   dse-research-utils = { path = "../research/src/python", editable = true }
dse-research-utils = { git = "https://github.com/dseinternational/research.git", subdirectory = "src/python", tag = "v0.18.0" }

[tool.hatch.version]
path = "src/language_reading_predictors/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/language_reading_predictors"]

# Pytest
[tool.pytest.ini_options]
markers = [
    "real_plan_currency: exercise the real run-plan currency checker, not the stub the module's autouse fixture installs",
    "slow: runs a whole-package type check; a few seconds each, kept out of the fast inner loop",
]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B905", "RUF012"]

# Check the package under strict typing flags, with explicit temporary exemptions.
[tool.mypy]
python_version = "3.14"
# Check new modules automatically; exemptions are listed below.
files = ["src/language_reading_predictors"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

# These modules still fail strict typing checks. test_type_coverage checks for
# new failures and for exemptions that have become unnecessary.
[[tool.mypy.overrides]]
module = [
  "language_reading_predictors.data_utils",
