[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "dse-language-reading-predictors"
dynamic = ["version"]
description = "Predictors of progress in language and reading skills for children with Down syndrome"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Frank Buckley" }]

dependencies = [
  # The compiled scientific core is no longer restated here: it is declared once
  # in dse-research-utils' own pyproject.toml and inherited transitively, so the
  # floors (numpy <2.5, pymc, pytensor, arviz, …) cannot drift between repos.
  # Extras carry the optional layers this repo actually imports:
  #   boosting   lightgbm, shap           (models/, scripts/rank_predictors.py)
  #   columnar   pyreadstat               (scripts/audit_rlm_source_provenance.py)
  #   dependence dcor                     (distance_corr_matrix in stats_utils.py)
  #   graphs     graphviz, networkx       (model graphs; ALSO needs the system `dot`)
  #   io         orjson, tabulate         (shared library I/O helpers)
  #   notebook   jupyter, jupytext        (notebooks/ are Jupytext-paired)
  #   tuning     optuna                   (scripts/tune_model.py)
  #   viz        seaborn                  (plot_utils.py and friends)
  # No `jax` extra: every pm.sample call site hardcodes nuts_sampler="nutpie"
  # and nothing imports jax or numpyro, so the JAX backend the old shared conda
  # core installed everywhere is genuinely unused here. No `storage` extra
  # either: h5netcdf/h5py — what ArviZ needs to write trace.nc — moved into the
  # library's base dependencies in v0.11.1, leaving only zarr behind that extra,
  # and nothing here imports zarr.
  "dse-research-utils[boosting,columnar,dependence,graphs,io,notebook,tuning,viz]"
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pandas-stubs",
  "pytest>=9.1.1",
  "ruff>=0.16.1",
  "scipy-stubs"
]

[tool.uv]
# Platforms the lockfile resolves for, copied from the research repo so both
# resolve for the same set. Intel macOS is deliberately absent: numba publishes
# no macOS x86_64 wheels and shap pins numba<0.63 there, so the stack cannot
# solve on that platform. Native win-amd64 is now covered — the conda-forge
# stack could not serve it (no win-64 jaxlib), so Windows no longer needs WSL.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[tool.uv.sources]
# dse-research-utils isn't published to PyPI — resolve it from the public git
# tag. To develop against a sibling checkout, replace this entry with:
#   dse-research-utils = { path = "../research/src/python", editable = true }
dse-research-utils = { git = "https://github.com/dseinternational/research.git", subdirectory = "src/python", tag = "v0.11.2" }

[tool.hatch.version]
path = "src/language_reading_predictors/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/language_reading_predictors"]

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B905", "RUF012"]

# Incremental static-typing gate (#361 Phase 5). The strict boundary covers typed
# family specifications/run plans, shared execution/report stages, atomic
# publication, environment provenance, registry documentation, and the high-value
# ITT/DiD/LCF runtime paths migrated under #521.
[tool.mypy]
python_version = "3.14"
files = [
  "src/language_reading_predictors/statistical_models/adjusted.py",
  "src/language_reading_predictors/statistical_models/aligned.py",
  "src/language_reading_predictors/statistical_models/block_exposure.py",
  "src/language_reading_predictors/statistical_models/concurrent.py",
  "src/language_reading_predictors/statistical_models/corr_factor.py",
  "src/language_reading_predictors/statistical_models/did.py",
  "src/language_reading_predictors/statistical_models/documentation.py",
  "src/language_reading_predictors/statistical_models/dose_response.py",
  "src/language_reading_predictors/statistical_models/fitted_payloads.py",
  "src/language_reading_predictors/statistical_models/gain_factors.py",
  "src/language_reading_predictors/statistical_models/growth.py",
  "src/language_reading_predictors/statistical_models/historical_growth.py",
  "src/language_reading_predictors/statistical_models/historical_joint.py",
  "src/language_reading_predictors/statistical_models/horseshoe.py",
  "src/language_reading_predictors/statistical_models/itt.py",
  "src/language_reading_predictors/statistical_models/joint.py",
  "src/language_reading_predictors/statistical_models/joint_mechanism.py",
  "src/language_reading_predictors/statistical_models/lcf_inference.py",
  "src/language_reading_predictors/statistical_models/lcf_summaries.py",
  "src/language_reading_predictors/statistical_models/level_factors.py",
  "src/language_reading_predictors/statistical_models/lcsm.py",
  "src/language_reading_predictors/statistical_models/long_corr_factor.py",
  "src/language_reading_predictors/statistical_models/loo_refit.py",
  "src/language_reading_predictors/statistical_models/mechanism.py",
  "src/language_reading_predictors/statistical_models/mediation_settings.py",
  "src/language_reading_predictors/statistical_models/output_transaction.py",
  "src/language_reading_predictors/statistical_models/pipelines/aligned.py",
  "src/language_reading_predictors/statistical_models/pipelines/did.py",
  "src/language_reading_predictors/statistical_models/pipelines/gain_factors.py",
  "src/language_reading_predictors/statistical_models/pipelines/itt.py",
  "src/language_reading_predictors/statistical_models/pipelines/joint.py",
  "src/language_reading_predictors/statistical_models/pipelines/long_corr_factor.py",
  "src/language_reading_predictors/statistical_models/provenance.py",
  "src/language_reading_predictors/statistical_models/stages.py",
  "src/language_reading_predictors/statistical_models/subfits.py",
  "src/language_reading_predictors/statistical_models/survival.py"
]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
