version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "03:21"
      timezone: "Europe/London"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # pytensor pins numba <=0.67.0 and numba 0.67.0 pins numpy <2.6, so numpy
    # 2.6 is unreachable however it is declared. Lift when a PyTensor release
    # admits numba 0.68. The same cap is declared in dse-research-utils'
    # pyproject.toml and inherited transitively, so both have to move together.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.6.0"]
    assignees:
      - frankbuckley

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "03:43"
      timezone: "Europe/London"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    assignees:
      - frankbuckley

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "03:31"
      timezone: "Europe/London"
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - frankbuckley
