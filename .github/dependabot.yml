version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: "Europe/London"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # pytensor pins numba <=0.66.0 and numba 0.66.0 pins numpy <2.5, so numpy
    # 2.5 is unreachable however it is declared. Lift when a PyTensor release
    # admits numba 0.67.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
    assignees:
      - frankbuckley

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: "Europe/London"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    assignees:
      - frankbuckley

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: "Europe/London"
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - frankbuckley
