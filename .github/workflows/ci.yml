name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1


      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run spellcheck
        run: npm run spellcheck

      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1


      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ scripts/

  test-python:
    # CI runs on linux-64 only. Native Windows cannot be covered at all:
    # jax/jaxlib have no conda-forge win-64 build, so the compiled stack cannot
    # solve there, and Windows users work in Ubuntu on WSL (linux-64) anyway.
    # macOS (osx-arm64) is no longer built here either — linux-64 is the
    # platform the analyses are actually run on.
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup conda environment
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Verify environment core matches the canonical spec
        run: dse-check-env environment.yml

      - name: Check registry-derived documentation
        run: python scripts/check_statistical_documentation.py

      - name: Type-check specification and reporting boundaries
        run: python -m mypy

      - name: Run pytest
        run: pytest
