name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1


      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run spellcheck
        run: npm run spellcheck

      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1


      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check src/ scripts/

  test-python:
    # uv provisions the interpreter itself from .python-version, so no
    # setup-python step is needed. Native Windows is covered now that the whole
    # stack ships wheels — the conda-forge layer could not solve there (no
    # win-64 jaxlib), which is why contributors previously needed WSL. Intel
    # macOS is absent because numba publishes no macOS x86_64 wheels at all.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails the build on a stale lockfile rather than silently
        # resolving something other than what is committed.
        run: uv sync --locked

      - name: Check registry-derived documentation
        run: uv run python scripts/check_statistical_documentation.py

      - name: Type-check specification and reporting boundaries
        run: uv run python -m mypy

      - name: Run pytest
        run: uv run pytest
