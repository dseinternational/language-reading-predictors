name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run spellcheck
        run: pnpm run spellcheck

      - name: Check formatting
        run: pnpm run format:check

  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check src/ scripts/

  test-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check registry-derived documentation
        run: uv run python scripts/check_statistical_documentation.py

      - name: Type-check specification and reporting boundaries
        run: uv run python -m mypy

      - name: Run pytest
        run: uv run pytest
